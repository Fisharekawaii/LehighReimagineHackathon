<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A getaway worth getting together for. Plan your trip, share the budget, and bring everyone along with DayTripper.">
<title>DayTripper — Go together.</title><link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;font-family:Arial,sans-serif;color:#193f3c;background:#f6f4eb}*{box-sizing:border-box}body{margin:0}main{min-height:100svh;display:grid;grid-template-columns:1fr 1fr}.copy{padding:clamp(28px,6vw,100px);display:flex;flex-direction:column;justify-content:space-between;gap:60px}.brand{font-size:25px;letter-spacing:-1px;font-weight:700}.brand span{color:#9c7748}.intro{max-width:560px;animation:arrive .9s both}h1{font-family:Georgia,serif;font-size:clamp(50px,6vw,88px);line-height:1.04;font-weight:400;letter-spacing:-3px;margin:20px 0 26px}p{font-size:17px;line-height:1.8;color:#536962;max-width:420px}.cta{display:inline-flex;align-items:center;gap:35px;background:#214b45;color:#fff;text-decoration:none;padding:19px 26px;border-radius:7px;margin-top:20px;transition:transform .2s,background .2s}.cta:hover{transform:translateY(-3px);background:#31685e}.cta:focus-visible,a:focus-visible{outline:3px solid #b98e4e;outline-offset:5px}.cta span{transition:transform .2s}.cta:hover span{transform:translateX(5px)}.hint{font-size:12px;margin-top:16px}footer{display:flex;gap:24px;font-size:12px;color:#66776c}footer a{color:inherit}.photo{position:relative;overflow:hidden;min-height:480px;background:#8aafa9}.photo img{width:100%;height:100%;object-fit:cover;position:absolute;animation:scenery 1.5s both}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,#123e3b66)}@keyframes arrive{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes scenery{from{transform:scale(1.06)}to{transform:scale(1)}}@media(max-width:760px){main{grid-template-columns:1fr}.copy{gap:40px;min-height:75svh}.photo{min-height:370px}h1{letter-spacing:-2px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><main><section class="copy"><div class="brand">daytripper<span>.</span></div><div class="intro"><h1>Go somewhere.<br>Go together.</h1><p>One place for the plans, the shared budget, and everyone coming along.</p><a class="cta" href="https://daytripper-weekends.dcano1697.chatgpt.site">Open DayTripper <span aria-hidden="true">↗</span></a><p class="hint">Opens the full app. Sign in or create an account to start.</p></div><footer><a href="https://github.com/Fisharekawaii/LehighReimagineHackathon">View project</a></footer></section><section class="photo" aria-label="Coastal getaway scenery"><img src="./assets/coast.jpg" alt="A coastal landscape beside blue water"></section></main></body></html>
